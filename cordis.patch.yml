# dsh-multi-root bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile <name> add link:<path>/dsh-multi-root`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (durable roots store + /api/dsh-multi-root routes +
# agent tools), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: multi-root
      name: '@luoyu-xingu/dsh-multi-root'
